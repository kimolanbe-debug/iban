<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBAN & İsim Paylaşım</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 28px 24px; max-width: 420px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h2 { color: #f8fafc; font-size: 20px; margin-bottom: 20px; text-align: center; }
    .input-group { margin-bottom: 14px; }
    label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 6px; }
    input { width: 100%; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 12px; border-radius: 8px; outline: none; }
    .btn { background: #2563eb; color: #ffffff; border: none; border-radius: 10px; padding: 14px; width: 100%; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn-secondary { background: #334155; color: #cbd5e1; }
    .result-box { margin-top: 18px; display: none; }
    .data-box { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 10px; color: #38bdf8; font-weight: 600; text-align: center; margin-bottom: 10px; }
    .hidden { display: none !important; }
    .info-label { color: #94a3b8; font-size: 12px; margin-bottom: 4px; }
  </style>
</head>
<body>

  <!-- 1. Oluşturucu -->
  <div class="card" id="generator-card">
    <h2>Link Oluşturucu</h2>
    <div class="input-group">
      <label>İsim Soyisim</label>
      <input type="text" id="input-name" placeholder="Örn: Ahmet Yılmaz">
    </div>
    <div class="input-group">
      <label>IBAN Numarası</label>
      <input type="text" id="input-iban" placeholder="TR00 0000...">
    </div>
    <button class="btn" onclick="generateLink()">Paylaşılabilir Link Oluştur</button>
    <div class="result-box" id="result-box">
      <label>Linkiniz:</label>
      <input type="text" id="generated-url" readonly style="margin-bottom: 10px;">
      <button class="btn btn-secondary" onclick="copyResult()">Linki Kopyala</button>
    </div>
  </div>

  <!-- 2. Görüntüleyici -->
  <div class="card hidden" id="viewer-card">
    <div class="info-label">Alıcı Adı</div>
    <div class="data-box" id="view-name"></div>
    <button class="btn btn-secondary" id="btn-copy-name" onclick="copyToClipboard('view-name', 'btn-copy-name')">İsmi Kopyala</button>
    
    <div class="info-label" style="margin-top:20px">IBAN</div>
    <div class="data-box" id="view-iban"></div>
    <button class="btn" id="btn-copy-iban" onclick="copyToClipboard('view-iban', 'btn-copy-iban')">IBAN'ı Kopyala</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('iban')) {
      document.getElementById('generator-card').classList.add('hidden');
      document.getElementById('viewer-card').classList.remove('hidden');
      document.getElementById('view-name').textContent = params.get('name') || 'Belirtilmemiş';
      document.getElementById('view-iban').textContent = params.get('iban');
    }

    function generateLink() {
      const n = encodeURIComponent(document.getElementById('input-name').value.trim());
      const i = encodeURIComponent(document.getElementById('input-iban').value.trim());
      if (!i) return alert('IBAN girmelisiniz!');
      const url = `${window.location.origin}${window.location.pathname}?name=${n}&iban=${i}`;
      document.getElementById('generated-url').value = url;
      document.getElementById('result-box').style.display = 'block';
    }

    function copyToClipboard(elementId, btnId) {
      const text = document.getElementById(elementId).textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById(btnId);
        const originalText = btn.textContent;
        btn.textContent = 'Kopyalandı! ✓';
        setTimeout(() => { btn.textContent = originalText; }, 2000);
      });
    }

    function copyResult() {
      const inp = document.getElementById('generated-url');
      inp.select();
      document.execCommand('copy');
      alert('Link kopyalandı!');
    }
  </script>
</body>
</html>
